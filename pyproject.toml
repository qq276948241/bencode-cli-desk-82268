[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bencode-cli"
version = "0.1.0"
description = "A small standard-library CLI for inspecting and rebuilding bencode files"
requires-python = ">=3.9"

[project.scripts]
bencode = "bencode_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

